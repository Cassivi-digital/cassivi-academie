  <body>
    <div id="root"><!--app-html--></div>

    <!--
      Déclaration du formulaire pour Netlify Forms.
      Netlify lit ce HTML statique au déploiement pour enregistrer le formulaire
      « devis » et ses champs. Le formulaire visible est rendu par React et
      envoie ses données à ce même formulaire. Ne pas supprimer : sans ce bloc,
      les demandes de devis ne seraient plus reçues.
      Les noms de champs doivent rester identiques à ceux de src/data/quoteForm.ts.
    -->
    <form name="devis" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="subject" data-remove-prefix value="Nouvelle demande de devis — %{formName} (%{submissionId})" />
      <input type="text" name="bot-field" />
      <input type="text" name="prenom" />
      <input type="text" name="nom" />
      <input type="email" name="email" />
      <input type="tel" name="telephone" />
      <input type="text" name="ville" />
      <input type="text" name="entreprise" />
      <input type="text" name="site-internet" />
      <select name="service"></select>
      <select name="budget"></select>
      <select name="objectif"></select>
      <textarea name="description"></textarea>
      <input type="checkbox" name="consentement" />
    </form>

 ioQuint:t=>t<.5?16*t**5:1-Math.pow(-2*t+2,5)/2,oExpo:t=>t>=1?1:1-Math.pow(2,-10*t),iExpo:t=>t<=0?0:Math.pow(2,10*t-10),
 ioExpo:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,

  walk(tmp,'');e.innerHTML=out.join('');e.ws=[...e.querySelectorAll('.wi')];return e}

/* ============ SCÈNE 1 — HOOK MÉTA : « cette pub que tu regardes » ============ */

el(pf,'',`display:flex;gap:44px;margin-top:16px;padding-left:6px`,['like','com','share'].map(k=>`<span style="width:34px;height:34px;display:inline-block">${I[k]}</span>`).join(''));

 `<span style="width:14px;height:14px;border-radius:50%;background:#FF5F57"></span><span style="width:14px;height:14px;border-radius:50%;background:#FEBC2E"></span><span style="width:14px;height:14px;border-radius:50%;background:#28C840"></span><span class="mono" style="margin-left:16px;font-size:20px;letter-spacing:.06em;color:#BFD0F2;white-space:nowrap">GESTIONNAIRE DE PUBLICITÉS</span><span style="flex:1"></span><span class="mono" style="font-size:18px;color:#14C0E6;white-space:nowrap">● ACTIVE</span>`);

  let cx=L(W*.86,kx,k1),cy=L(H*.9,r.top+6,k1);if(k3>0){cx=L(kx,ro.left+ro.width*.6,k3);cy=L(r.top+6,ro.top+ro.height*.55,k3)}

  const cl1=P(t,C.a1+1.33,.45);tf(ripple,{x:ro.left+ro.width*.6-60,y:ro.top+ro.height*.55-60,s:L(.3,1.6,E.oCub(cl1)),o:cl1>0&&cl1<1?1-cl1:0});

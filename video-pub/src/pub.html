<body>
<div id="stage">
  <!-- global background -->
  <div id="bg" class="a" style="inset:0;width:1080px;height:1920px">
    <div id="glow1" class="a" style="width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(30,91,255,.10),rgba(30,91,255,0) 65%)"></div>

    <div class="a" style="inset:0;width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,0) 55%,rgba(232,238,248,.75) 100%)"></div>

</div>

<script>
/* ============================================================
   CASSIVI DIGITAL MG — moteur d'animation déterministe
   render(t) dessine l'image exacte à l'instant t (secondes)
   ============================================================ */
const W=1080,H=1920;
// --- timing (recalé sur la voix off via window.CUES) ---
const C=Object.assign({
  h1:.45,h2:2.6,s2:4.6,
  p2a:4.75,p2b:8.6,p2c:10.4,s3:14.2,
  p3a:14.35,p3b:16.0,p3c:18.6,p3d:19.8,p3e:21.2,s4:24.0,
  p4a:24.15,p4b:27.0,p4c:29.0,p4d:30.8,p4e:32.6,s4b:35.0,
  p5a:35.1,p5b:37.0,p5c:41.0,s5:45.0,
  p6a:45.15,p6b:46.4,p6c:48.6,p6d:51.6,s6:55.0,
  p7a:55.1,p7b:57.0,p7c:59.0,s7:60.8,
  p8a:61.0,p8b:62.4,end:71.0
},window.CUES||{});
window.DUR=C.end;

// --- maths & easing ---
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,d)=>d<=0?(t>=a?1:0):cl((t-a)/d);
const L=(a,b,p)=>a+(b-a)*p;
const E={
  lin:t=>t,
  oCub:t=>1-Math.pow(1-t,3), iCub:t=>t*t*t,
  ioCub:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  oQuint:t=>1-Math.pow(1-t,5), iQuint:t=>t*t*t*t*t,
  ioQuint:t=>t<.5?16*t*t*t*t*t:1-Math.pow(-2*t+2,5)/2,
  oExpo:t=>t>=1?1:1-Math.pow(2,-10*t), iExpo:t=>t<=0?0:Math.pow(2,10*t-10),
  ioExpo:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  oBack:t=>{const c1=1.45,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  oElastic:t=>t<=0?0:t>=1?1:Math.pow(2,-9*t)*Math.sin((t*10-.75)*(2*Math.PI)/3.2)+1,
};
// in -> hold -> out envelope
const env=(t,a,b,din=.4,dout=.4,ei=E.oCub,eo=E.iCub)=>Math.min(ei(P(t,a,din)),1-eo(P(t,b-dout,dout)));

// --- DOM helpers ---
const $=id=>document.getElementById(id);
function el(parent,cls,css,html){const e=document.createElement('div');if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;parent.appendChild(e);return e}
function words(parent,cls,css,html){ // html with words; keeps inner spans (e.g. .grad) per word
  const e=el(parent,cls,css);
  const tmp=document.createElement('div');tmp.innerHTML=html;
  const out=[];
  const walk=(node,wrapCls)=>{
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){n.textContent.split(/(\s+)/).forEach(tok=>{
        if(!tok)return; if(/^\s+$/.test(tok)){out.push(tok.includes('\n')?'<br>':' ');return}
        out.push(`<span class="w"><span class="wi ${wrapCls||''}">${tok}</span></span>`);});}
      else if(n.nodeName==='BR'){out.push('<br>')}
      else walk(n,(wrapCls?wrapCls+' ':'')+n.className);
    });};
  walk(tmp,'');e.innerHTML=out.join('');e.ws=[...e.querySelectorAll('.wi')];return e}
function rw(e,t,start,o={}){ // reveal words (mask slide up)
  const st=o.st??.075,d=o.d??.6,dy=o.dy??105;
  e.ws.forEach((w,i)=>{
    const p=(o.ease||E.oExpo)(P(t,start+i*st,d));
    let y=(1-p)*dy,op=cl(p*1.6),rot=(1-p)*(o.rot??4);
    if(o.out!=null){const q=E.iCub(P(t,o.out+i*(o.ost??.03),o.od??.35));y-=q*dy;op*=1-q}
    w.style.transform=`translate3d(0,${y}%,0) rotate(${rot}deg)`;w.style.opacity=op;
  });
}
function tf(e,{x=0,y=0,s=1,sx=null,sy=null,r=0,o=null,b=0}={}){
  e.style.transform=`translate3d(${x}px,${y}px,0) scale(${sx??s},${sy??s}) rotate(${r}deg)`;
  if(o!=null)e.style.opacity=o;
  e.style.filter=b>0.05?`blur(${b}px)`:'none';
}
function vis(e,on){e.style.visibility=on?'visible':'hidden'}
const nb=' ';
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,nb);
function textW(e){const r=document.createRange();r.selectNodeContents(e);return r.getBoundingClientRect().width}
function fitW(e,maxW){let fs=parseFloat(getComputedStyle(e).fontSize);let n=0;while(textW(e)>maxW&&fs>12&&n++<200){fs-=1;e.style.fontSize=fs+'px'}}

// --- icônes (traits) ---
const I={
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
  code:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>',
  bars:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 20V12M10 20V6M15 20v-9M20 20V4"/></svg>',
  trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.3" fill="currentColor"/></svg>',
  route:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 000-6H9a3 3 0 010-6h6.5"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8.5" r="4.2"/><path d="M4 20.5c.8-4 4-6.2 8-6.2s7.2 2.2 8 6.2z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7.5 7.5 0 00-7.5 7.5C4.5 15 12 22 12 22s7.5-7 7.5-12.5A7.5 7.5 0 0012 2zm0 10.2a2.8 2.8 0 110-5.6 2.8 2.8 0 010 5.6z"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>',
  laptop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 19h20"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5L1.5 21h21z"/><path d="M12 9v5.5" stroke="#fff" stroke-width="2.4"/><circle cx="12" cy="17.6" r="1.3" fill="#fff"/></svg>',
  wa:'<svg viewBox="0 0 32 32"><path fill="#fff" d="M16 3.2A12.7 12.7 0 005.1 22.4L3.4 28.6l6.4-1.7A12.7 12.7 0 1016 3.2z"/><path fill="#25D366" d="M16 5.4a10.5 10.5 0 00-8.9 16.1l.25.4-1 3.7 3.8-1 .38.23A10.5 10.5 0 1016 5.4z"/><path fill="#fff" d="M12.3 10.1c-.24-.53-.49-.54-.72-.55h-.61a1.2 1.2 0 00-.85.4 3.6 3.6 0 00-1.12 2.66 6.2 6.2 0 001.31 3.31 13.2 13.2 0 005.48 4.84c2.72 1.07 3.27.86 3.86.8a3.2 3.2 0 002.17-1.53 2.7 2.7 0 00.19-1.53c-.08-.13-.29-.21-.61-.37s-1.9-.94-2.19-1.04-.51-.16-.72.16-.83 1.04-1.01 1.25-.37.24-.69.08a8.7 8.7 0 01-2.57-1.59 9.6 9.6 0 01-1.78-2.21c-.19-.32 0-.49.14-.65s.32-.37.48-.56a2.2 2.2 0 00.32-.53.59.59 0 000-.56c-.08-.16-.7-1.75-.98-2.38z"/></svg>'
};

const S=$('scenes');
function scene(){return el(S,'scene','')}

/* ================= BACKGROUND / GRAIN ================= */
(function(){ // noise texture
  const c=document.createElement('canvas');c.width=360;c.height=640;const g=c.getContext('2d');const d=g.createImageData(360,640);
  let s=1234567;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
  for(let i=0;i<d.data.length;i+=4){const v=110+rnd()*145;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  g.putImageData(d,0,0);const g2=$('grain');g2.style.backgroundImage=`url(${c.toDataURL()})`;g2.style.backgroundSize='720px 1280px';
})();
function renderBG(t){
  tf($('dots'),{x:-(t*6)%40,y:-(t*14)%40});
  tf($('glow1'),{x:-260+Math.sin(t*.35)*120,y:-200+Math.cos(t*.27)*140});
  tf($('glow2'),{x:420+Math.cos(t*.31)*120,y:1150+Math.sin(t*.22)*160});
  const f=Math.floor(t*24);$('grain').style.backgroundPosition=`${(f*137)%720}px ${(f*271)%1280}px`;
}

/* ================= FX LAYER (transitions) ================= */
const FX=$('fx');
const ringSVG=el(FX,'a','left:0;top:0;width:1080px;height:1920px',`<svg width="1080" height="1920" viewBox="0 0 1080 1920">
 <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E5BFF"/><stop offset="1" stop-color="#14C0E6"/></linearGradient></defs>
 <circle id="ringA" cx="540" cy="960" r="0" fill="none" stroke="url(#rg)" stroke-width="0"/>
 <circle id="ringB" cx="540" cy="960" r="0" fill="none" stroke="#0A1B3F" stroke-width="0"/></svg>`);
const iris=el(FX,'a','left:0;top:0;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#1A3A7A,#0A1B3F 70%);visibility:hidden');
const streak=el(FX,'a','left:-600px;top:-400px;width:500px;height:2800px;background:linear-gradient(90deg,rgba(20,192,230,0),rgba(20,192,230,.35),rgba(255,255,255,.9),rgba(30,91,255,.3),rgba(30,91,255,0));transform-origin:center;visibility:hidden;mix-blend-mode:screen');
const flash=el(FX,'a','left:0;top:0;width:1080px;height:1920px;background:#fff;opacity:0');
const wipe=el(FX,'a','left:-200px;top:0;width:1480px;height:2600px;background:linear-gradient(180deg,#13295A,#0A1B3F);visibility:hidden');
const wipeEdge=el(wipe,'a','left:0;top:-14px;width:1480px;height:14px;background:linear-gradient(90deg,#1E5BFF,#14C0E6,#C9A45C)');

/* ===================================================================
   SCÈNE 1 — HOOK
   =================================================================== */
const s1=scene();
const s1ui=el(s1,'a','left:0;top:0;width:1080px;height:1920px');
const uiChips=[
  ['IMPRESSIONS','48 650',90,330,1.0,.55],['CLICS','1 274',700,420,.85,.4],['CTR','2,6 %',110,1430,.9,.45],
  ['CPC','0,42 €',690,1520,1.05,.6],['CONVERSIONS','96',640,250,.75,.3],['ROAS','×3,1',60,1640,.8,.35]
].map(([k,v,x,y,s,dp],i)=>{
  const c=el(s1ui,'a card',`left:${x}px;top:${y}px;width:330px;height:150px;padding:26px 30px;border-radius:24px`);
  el(c,'mono','font-size:20px;letter-spacing:.16em;color:#8F9BB2;font-weight:600',k);
  el(c,'mont','font-size:46px;font-weight:800;margin-top:8px;color:#0A1B3F',v);
  const sp=el(c,'a','right:26px;top:30px;width:110px;height:44px',`<svg width="110" height="44" viewBox="0 0 110 44"><path d="M2 38 L20 30 L36 33 L54 20 L70 24 L88 10 L108 6" fill="none" stroke="${i%2?'#14C0E6':'#1E5BFF'}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`);
  return {c,s,dp,i,x,y,path:sp.querySelector('path')};
});
const s1txt=el(s1,'a','left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px');
const hA=words(s1txt,'a','left:0;top:640px;width:1080px;text-align:center;font-weight:600;font-size:56px;color:#5C6B86','Et si une');
const hB=words(s1txt,'a h','left:0;top:730px;width:1080px;text-align:center;font-size:136px;font-weight:900;color:#0A1B3F;white-space:nowrap','COMPÉTENCE');
const hC=words(s1txt,'a h','left:0;top:868px;width:1080px;text-align:center;font-size:136px;font-weight:900;white-space:nowrap','<span class="grad">DIGITALE</span>');
const hD=words(s1txt,'a','left:0;top:1062px;width:1080px;text-align:center;font-weight:600;font-size:56px;color:#5C6B86','devenait ton');
const hE=words(s1txt,'a h','left:0;top:1140px;width:1080px;text-align:center;font-size:118px;font-weight:900;color:#0A1B3F;white-space:nowrap','VRAI MÉTIER ?');
const hEu=el(s1txt,'a','left:300px;top:1272px;width:480px;height:12px;border-radius:6px;background:linear-gradient(90deg,#B8914A,#E8D19C,#B8914A);transform-origin:0 50%');
const dot=el(s1,'a','left:530px;top:950px;width:20px;height:20px;border-radius:50%;background:#14C0E6;box-shadow:0 0 30px 8px rgba(20,192,230,.6)');
const s1ring=el(s1,'a','left:0;top:0;width:1080px;height:1920px',`<svg width="1080" height="1920"><circle id="s1r1" cx="540" cy="960" r="0" fill="none" stroke="#1E5BFF" stroke-width="40"/><circle id="s1r2" cx="540" cy="960" r="0" fill="none" stroke="#14C0E6" stroke-width="6"/><path id="s1arc" d="" fill="none" stroke="#C9A45C" stroke-width="5" stroke-linecap="round"/></svg>`);
function arcPath(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const [x0,y0]=p(a0),[x1,y1]=p(a1);const lg=(a1-a0)%(2*Math.PI)>Math.PI?1:0;return `M${x0} ${y0} A${r} ${r} 0 ${lg} 1 ${x1} ${y1}`}

function renderS1(t){
  const on=t<C.s2+.3;vis(s1,on);if(!on)return;
  // ouverture : point -> anneau qui éclate
  const pd=P(t,0,.32);tf(dot,{s:L(.2,1.3,E.oBack(pd))*(1-E.iCub(P(t,.32,.12))),o:1-P(t,.38,.08)});
  const pr=E.oExpo(P(t,.3,1.1));
  $('s1r1').setAttribute('r',pr*1300);$('s1r1').setAttribute('stroke-width',L(70,0,pr));$('s1r1').style.opacity=1-P(t,.9,.5);
  const pr2=E.oExpo(P(t,.36,1.3));$('s1r2').setAttribute('r',pr2*1100);$('s1r2').style.opacity=(1-pr2)*.9;
  // arc doré qui tourne autour du titre (rappel de l'anneau du logo)
  const pa=E.oQuint(P(t,1.0,1.4));const rot=t*.5;
  $('s1arc').setAttribute('d',pa>0.01?arcPath(540,960,470,-1.9+rot,-1.9+rot+pa*1.15):'');
  $('s1arc').style.opacity=.85*(1-P(t,C.s2-.6,.4));
  // UI chips en profondeur (parallaxe)
  uiChips.forEach(u=>{
    const p=E.oExpo(P(t,.55+u.i*.09,.9));
    const drift=(t-.5)*-22*u.s;
    tf(u.c,{y:drift+(1-p)*120,s:u.s*L(.8,1,p),o:p*u.dp*(1-P(t,C.s2-.5,.4)),b:(1-u.s)*10+ (1-p)*6});
    u.path.style.strokeDashoffset=1-E.oCub(P(t,.9+u.i*.1,1.2));
  });
  // typographie cinétique synchronisée
  rw(hA,t,C.h1,{st:.08,d:.55});

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MEDIA BUYER IA · V2 Salle · 1080 × 1350</title>
<link rel="stylesheet" href="commun.css">
<style>
  .canvas { background: radial-gradient(900px 620px at 100% 0%, #EEF4FF 0%, #FFFFFF 62%); }
  /* anneau du logo, en filigrane très léger */
  .ring { position: absolute; right: -170px; top: -230px; width: 560px; height: 560px; border-radius: 50%; border: 26px solid rgb(30 91 255 / .06); }
  .ring.small { right: -60px; top: -120px; width: 340px; height: 340px; border: 14px solid rgb(34 168 232 / .08); }

  .head { position: absolute; left: 48px; right: 48px; top: 44px; display: flex; align-items: center; justify-content: space-between; }
  .head .brand img { width: 96px; height: 96px; }
  .head .brand span { font-size: 30px; }

  .intro { position: absolute; left: 48px; right: 48px; top: 186px; }
  .eyebrow { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 25px; letter-spacing: .12em; color: var(--blue); white-space: nowrap; }
  .eyebrow::before { content: ''; width: 44px; height: 4px; border-radius: 2px; background: var(--cyan); }
  h1 { font-size: 112px; margin-top: 18px; }
  .sub { font-size: 35px; line-height: 1.3; margin-top: 20px; max-width: 960px; }
  .chips { display: flex; gap: 12px; margin-top: 26px; }
  .chips span { height: 54px; padding: 0 22px; display: inline-flex; align-items: center; border-radius: 999px; background: #fff;
    border: 2px solid var(--line); font-weight: 700; font-size: 26px; color: var(--navy); white-space: nowrap; }

  .photo { position: absolute; left: 40px; right: 40px; top: 600px; bottom: 40px; border-radius: 34px; overflow: hidden;
    box-shadow: 0 30px 60px -30px rgb(11 27 63 / .45); }
  .photo img { position: absolute; left: -40px; top: -80px; width: 1080px; height: 810px; }

  .price-card { position: absolute; left: 72px; bottom: 72px; padding: 26px 34px 24px; border-radius: 26px; background: #fff;
    box-shadow: 0 24px 50px -18px rgb(11 27 63 / .55); }
  .price-card .price { font-size: 70px; color: var(--navy); }
  .price-card .resa { margin-top: 10px; font-weight: 700; font-size: 29px; color: var(--blue); white-space: nowrap; }
</style>
</head>
<body>
<div class="canvas">
  <div class="head">
    <div class="brand"><img src="../build/logo_badge.png" alt="CASSIVI DIGITAL MG"><span>CASSIVI DIGITAL MG</span></div>
    <div class="live"><i></i>INSCRIPTIONS OUVERTES</div>
  </div>

  <div class="intro">
    <div class="eyebrow">FORMATION PRATIQUE&nbsp;– 2&nbsp;JOURS</div>
    <h1>MEDIA BUYER <em>IA</em></h1>
    <p class="sub">Apprends à piloter les campagnes publicitaires avec l’intelligence artificielle.</p>
    <div class="chips"><span>Meta&nbsp;Ads</span><span>Google&nbsp;Ads</span><span>Tracking</span><span>KPI</span><span>Claude</span></div>
  </div>

  <div class="photo"><img src="../build/photo_classe.jpg" alt=""></div>

  <div class="price-card">
    <div class="price">350&nbsp;000&nbsp;Ar</div>
    <div class="resa">Réservation&nbsp;: 50&nbsp;000&nbsp;Ar</div>
  </div>
</div>
<script>
  window.__mesures = function () {
    const r = {};
    document.querySelectorAll('.head, .head .brand, .live, .eyebrow, h1, .sub, .chips, .photo, .price-card').forEach((el, i) => {
      const b = el.getBoundingClientRect(); r[(el.className || el.tagName) + '#' + i] = [Math.round(b.left), Math.round(b.top), Math.round(b.right), Math.round(b.bottom), el.scrollWidth > el.clientWidth + 1 ? 'DEBORDE' : ''];
    });
    const h=document.querySelector('h1'); const rg=document.createRange(); rg.selectNodeContents(h); const bb=rg.getBoundingClientRect(); r.titre_texte=[Math.round(bb.left),Math.round(bb.right)];
    return r;
  };
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Écran projeté : tableau de bord Meta Ads</title>
<style>
  @font-face { font-family: 'Inter'; src: url('../../landing-media-buyer/site/assets/fonts/inter-var-latin.woff2') format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 730px; background: #fff; font-family: 'Inter', sans-serif; color: #0D1733; }
  .top { height: 74px; display: flex; align-items: center; gap: 18px; padding: 0 34px; background: #EAF1FF; border-bottom: 3px solid #1E5BFF; }
  .top b { font-size: 30px; font-weight: 800; }
  .top span { font-size: 22px; color: #44506A; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 24px 34px 0; }
  .kpi { border: 3px solid #DCE5F5; border-radius: 14px; padding: 14px 18px; }
  .kpi small { display: block; font-size: 19px; color: #5C6B86; font-weight: 600; }
  .kpi strong { display: block; font-size: 40px; font-weight: 800; margin-top: 4px; }
  .kpi i { font-style: normal; font-size: 18px; font-weight: 700; color: #0E7C3F; }
  .charts { display: grid; grid-template-columns: 1.55fr 1fr; gap: 20px; padding: 20px 34px 0; }
  .card { border: 3px solid #DCE5F5; border-radius: 14px; padding: 14px 18px; height: 300px; }
  .card h3 { font-size: 21px; font-weight: 700; color: #44506A; margin-bottom: 8px; }
  svg { display: block; }
  .rows { padding: 18px 34px 0; display: grid; gap: 10px; }
  .row { display: flex; align-items: center; gap: 16px; height: 36px; border-radius: 8px; background: #F3F6FC; padding: 0 16px; font-size: 18px; font-weight: 600; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #0E7C3F; }
  .bar { height: 12px; border-radius: 6px; background: #1E5BFF; }
</style>
</head>
<body>
  <div class="top"><b>Meta Ads</b><span>Tableau de bord des campagnes</span></div>
  <div class="kpis">
    <div class="kpi"><small>Coût par résultat</small><strong>2 450 Ar</strong><i>▼ 12 %</i></div>
    <div class="kpi"><small>CTR</small><strong>2,8 %</strong><i>▲ 0,6</i></div>
    <div class="kpi"><small>CPC</small><strong>310 Ar</strong><i>▼ 8 %</i></div>
    <div class="kpi"><small>ROAS</small><strong>3,4</strong><i>▲ 0,5</i></div>
  </div>
  <div class="charts">
    <div class="card">
      <h3>Résultats par jour</h3>
      <svg width="610" height="236" viewBox="0 0 610 236">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E5BFF" stop-opacity=".45"/><stop offset="1" stop-color="#1E5BFF" stop-opacity=".05"/></linearGradient></defs>
        <g stroke="#E3E8F2" stroke-width="2"><line x1="0" y1="40" x2="610" y2="40"/><line x1="0" y1="100" x2="610" y2="100"/><line x1="0" y1="160" x2="610" y2="160"/><line x1="0" y1="220" x2="610" y2="220"/></g>
        <path d="M0 200 L60 188 L120 194 L180 160 L240 168 L300 128 L360 136 L420 96 L480 104 L540 62 L610 44 L610 230 L0 230 Z" fill="url(#g)"/>
        <path d="M0 200 L60 188 L120 194 L180 160 L240 168 L300 128 L360 136 L420 96 L480 104 L540 62 L610 44" fill="none" stroke="#1E5BFF" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M0 214 L60 210 L120 206 L180 200 L240 196 L300 186 L360 182 L420 172 L480 168 L540 158 L610 150" fill="none" stroke="#22A8E8" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="card">
      <h3>Dépense par campagne</h3>
      <svg width="370" height="236" viewBox="0 0 370 236">
        <g fill="#1E5BFF">
          <rect x="10" y="70" width="52" height="160" rx="8"/>
          <rect x="82" y="120" width="52" height="110" rx="8"/>
          <rect x="154" y="40" width="52" height="190" rx="8"/>
          <rect x="226" y="140" width="52" height="90" rx="8"/>
        </g>
        <rect x="298" y="98" width="52" height="132" rx="8" fill="#22A8E8"/>
      </svg>
    </div>
  </div>
  <div class="rows">
    <div class="row"><span class="dot"></span>Campagne Prospects · Facebook et Instagram<span class="bar" style="width:260px;margin-left:auto"></span></div>
    <div class="row"><span class="dot"></span>Campagne Recherche · Google Ads<span class="bar" style="width:180px;margin-left:auto;background:#22A8E8"></span></div>
    <div class="row"><span class="dot"></span>Reciblage · visiteurs du site<span class="bar" style="width:120px;margin-left:auto"></span></div>
  </div>
</body>
</html>

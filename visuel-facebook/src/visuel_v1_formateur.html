<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MEDIA BUYER IA · V1 Formateur · 1080 × 1350</title>
<link rel="stylesheet" href="commun.css">
<style>
  .photo { position: absolute; left: 0; top: 0; width: 1080px; height: 790px; overflow: hidden; }
  .photo img { position: absolute; left: 0; top: -6px; width: 1080px; height: 810px; }
  /* léger voile en haut pour asseoir le logo sur le plafond */
  .photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(255 255 255 / .28) 0%, rgb(255 255 255 / 0) 22%); }

  .brand-pill { position: absolute; left: 40px; top: 40px; padding: 10px 28px 10px 10px; border-radius: 999px; background: rgb(255 255 255 / .94);
    box-shadow: 0 10px 30px -8px rgb(11 27 63 / .35); }
  .brand-pill img { width: 84px; height: 84px; }
  .brand-pill span { font-size: 28px; }

  .sheet { position: absolute; left: 0; right: 0; top: 742px; bottom: 0; background: #fff; border-radius: 40px 40px 0 0;
    box-shadow: 0 -18px 40px -24px rgb(11 27 63 / .45); padding: 64px 56px 0; }
  .sheet .live { position: absolute; left: 56px; top: -28px; box-shadow: 0 10px 24px -10px rgb(11 27 63 / .6); }

  h1 { font-size: 108px; }
  .sub { font-size: 35px; line-height: 1.3; margin-top: 20px; max-width: 930px; }
  .topics { font-size: 30px; margin-top: 20px; }

  .offer { position: absolute; left: 56px; right: 56px; bottom: 44px; height: 172px; border-radius: 30px; padding: 0 40px;
    background: linear-gradient(120deg, #0B1B3F 0%, #12275A 100%); color: #fff; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 22px 40px -22px rgb(11 27 63 / .7); overflow: hidden; }
  .offer::before { content: ''; position: absolute; right: -150px; top: -150px; width: 300px; height: 300px; border-radius: 50%;
    border: 12px solid rgb(34 168 232 / .14); }
  .offer::after { content: ''; position: absolute; left: 660px; top: 34px; bottom: 34px; width: 2px; background: rgb(255 255 255 / .14); }
  .offer .left { position: relative; }
  .offer .format { font-weight: 800; font-size: 25px; letter-spacing: .1em; color: #9FD9F7; white-space: nowrap; }
  .offer .left .price { font-size: 78px; margin-top: 12px; }
  .offer .resa { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .offer .resa small { font-size: 28px; font-weight: 600; color: #9FD9F7; }
  .offer .resa strong { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 46px; letter-spacing: -.01em; white-space: nowrap; }
</style>
</head>
<body>
<div class="canvas">
  <div class="photo"><img src="../build/photo_formateur.jpg" alt=""></div>

  <div class="brand brand-pill"><img src="../build/logo_badge.png" alt="CASSIVI DIGITAL MG"><span>CASSIVI DIGITAL MG</span></div>

  <div class="sheet">
    <div class="live"><i></i>INSCRIPTIONS OUVERTES</div>
    <h1>MEDIA BUYER <em>IA</em></h1>
    <p class="sub">Apprends à piloter les campagnes publicitaires avec l’intelligence artificielle.</p>
    <p class="topics">Meta&nbsp;Ads<b>•</b>Google&nbsp;Ads<b>•</b>Tracking<b>•</b>KPI<b>•</b>Claude</p>
  </div>

  <div class="offer">
    <div class="left">
      <div class="format">FORMATION PRATIQUE&nbsp;– 2&nbsp;JOURS</div>
      <div class="price">350&nbsp;000&nbsp;Ar</div>
    </div>
    <div class="resa"><small>Réservation&nbsp;:</small><strong>50&nbsp;000&nbsp;Ar</strong></div>
  </div>
</div>
<script>
  window.__mesures = function () {
    const r = {};
    document.querySelectorAll('h1, .sub, .topics, .offer .format, .offer .price, .offer .resa, .brand-pill, .live').forEach((el, i) => {
      const b = el.getBoundingClientRect(); r[(el.className || el.tagName) + '#' + i] = [Math.round(b.left), Math.round(b.top), Math.round(b.right), Math.round(b.bottom), el.scrollWidth > el.clientWidth + 1 ? 'DEBORDE' : ''];
    });
    const h=document.querySelector('h1'); const rg=document.createRange(); rg.selectNodeContents(h); const bb=rg.getBoundingClientRect(); r.titre_texte=[Math.round(bb.left),Math.round(bb.right)];
    return r;
  };
</script>
</body>
</html>

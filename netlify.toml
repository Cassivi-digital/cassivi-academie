# Configuration Netlify — portfolio PPC de Sitraka Ramamonjisoa
#
# Ce fichier sert au déploiement depuis GitHub (Netlify construit le site).
# Pour un dépôt manuel du dossier construit, il n'est pas lu : rien à faire,
# les en-têtes sont dans public/_headers, qui accompagne le dossier publié.
#
# Le formulaire « devis » repose sur Netlify Forms. Deux réglages se font
# dans l'interface Netlify, quel que soit le mode de déploiement :
#   1. Forms > Enable form detection           (puis relancer un déploiement)
#   2. Forms > Submission notifications > Add notification > Email notification
# Voir le README, section « Déploiement sur Netlify ».

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
